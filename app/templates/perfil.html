{% extends "base.html" %}

{% block title %}Perfil - Sistema Template{% endblock %}

{% block content %}
<div class="perfil-container">

    <aside class="sidebar">
        <h2>Perfil</h2>
        <nav class="sidebar-menu">
            <a href="{{ url_for('main.perfil_informacoes') }}" class="btn-perfil {% if active_page == 'informacoes' %}active{% endif %}">Informações</a>
            <a href="{{ url_for('main.perfil_carrinho') }}" class="btn-perfil {% if active_page == 'carrinho' %}active{% endif %}">Carrinho</a>
            <a href="{{ url_for('main.perfil_preferencias') }}" class="btn-perfil {% if active_page == 'preferencias' %}active{% endif %}">Preferências de Acessibilidade</a>
            <a href="{{ url_for('main.perfil_historico') }}" class="btn-perfil {% if active_page == 'historico' %}active{% endif %}">Histórico</a>
            <a href="{{ url_for('main.perfil_favoritos') }}" class="btn-perfil {% if active_page == 'favoritos' %}active{% endif %}">Favoritos</a>
        </nav>
    </aside>

    <main class="perfil-conteudo">
        {% block perfil_content %}{% endblock %}
    </main>
</div>
{% endblock %}
